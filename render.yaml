services:
  - type: web
    name: pricescout
    runtime: node
    plan: starter            # a persistent disk requires a paid plan; on free, SQLite resets on each deploy/restart
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    disk:
      name: pricescout-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /var/data
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CRON_SECRET
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:you@example.com
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: ALERT_SMS_TO
        sync: false
  - type: cron
    name: pricescout-price-check
    runtime: node
    schedule: "0 * * * *"    # hourly
    buildCommand: "true"
    startCommand: 'curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/check-prices"'
    envVars:
      - key: APP_URL
        sync: false          # set to the web service URL, e.g. https://pricescout.onrender.com
      - key: CRON_SECRET
        fromService:
          type: web
          name: pricescout
          envVarKey: CRON_SECRET
