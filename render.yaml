services:
  - type: web
    name: pricescout
    runtime: node
    plan: free               # free plan: no persistent disk, SQLite lives in ./data and resets on redeploy/restart/spin-down
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: DATABASE_URL     # optional: Postgres for persistent data (free Render Postgres expires after ~30 days)
        fromDatabase:
          name: pricescout-db
          property: connectionString
      - key: NODE_VERSION
        value: 20
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CRON_SECRET
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:you@example.com
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: ALERT_SMS_TO
        sync: false
databases:
  - name: pricescout-db
    plan: free
    region: oregon
    databaseName: pricescout
    user: pricescout
    ipAllowList: []   # internal access only
# No Render cron job (cron jobs are not available on the free plan).
# Scheduled price checks run from GitHub Actions (.github/workflows/check-prices.yml, hourly),
# which calls POST $APP_URL/api/cron/check-prices with
# 'Authorization: Bearer $CRON_SECRET', or use the in-app "Simulate price drop" button.
